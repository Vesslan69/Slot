.header:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 65%,#02070d 100%)}
.top{position:absolute;z-index:3;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}
.round{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:rgba(2,8,13,.78);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 0 14px #b97819;cursor:pointer}
.round:active,.spin:active{transform:scale(.94)}
.reels-shell{position:relative;margin:-2px 10px 0;padding:10px;border:3px solid #9b691b;border-radius:18px;background:linear-gradient(145deg,#142838,#03080e 45%,#162a3b);box-shadow:0 0 18px #000,inset 0 0 12px #b57b22}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#02060a;padding:4px;border-radius:8px;overflow:hidden}
.reel{height:238px;overflow:hidden;position:relative;background:#06101a;border:1px solid #425b6c}
.strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform}
.symbol{width:100%;height:238px;flex:0 0 238px;background-size:cover;background-position:center;border-bottom:1px solid #263d4c}
.lines{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:#f2c24d;font-weight:900;font-size:13px;text-shadow:0 2px 3px #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 10px 8px}
.stat{border:2px solid #8d5e15;border-radius:12px;background:linear-gradient(#07131e,#02070d);text-align:center;padding:8px 4px;box-shadow:inset 0 0 12px rgba(245,181,43,.08)}
.stat b{display:block;color:#d9a52e;font-size:12px;letter-spacing:1px}
.stat span{font-size:20px;font-weight:900}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 8px 4px}
.ctrl{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:#030a11;color:#fff;font-size:29px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 12px rgba(245,181,43,.32),inset 0 0 8px #fff1;cursor:pointer}
.ctrl.gold{color:#ffd72d;border-color:#ffd72d}
.spin{width:118px;height:118px;border-radius:50%;border:3px solid #f5b52b;background:radial-gradient(circle,#0d4d79 0 46%,#082d4b 47% 60%,#f0a71a 61% 66%,#120b04 67%);color:#ffbf26;font-size:58px;display:grid;place-items:center;box-shadow:0 0 25px #f2a21b,inset 0 0 16px #fff3;cursor:pointer}
.message{height:32px;text-align:center;color:#f4bc36;font-weight:900;font-size:17px;text-shadow:0 2px 4px #000}
@media(max-width:430px){
.top{top:9px;left:9px;right:9px}.round{width:50px;height:50px;font-size:24px}
.reels-shell{margin-left:7px;margin-right:7px;padding:7px;border-radius:15px}
.reel,.symbol{height:175px}.symbol{flex-basis:175px}
.controls{gap:6px}.ctrl{width:50px;height:50px;font-size:25px}.spin{width:98px;height:98px;font-size:49px}
.stat span{font-size:18px}.stats{gap:5px}
}
</style>
</head>
<body>
<main class="game">
<section class="header">
  <div class="top">
    <button class="round" onclick="showMsg('MENU')">☰</button>
    <button class="round" id="soundTop" onclick="toggleSound()">🔊</button>
  </div>
</section>

<section class="reels-shell">
  <div class="reels" id="reels"></div>
  <div class="lines"><span>10 LINES</span><span>NORDIC WARRIOR</span><span>10 LINES</span></div>
</section>

<section class="stats">
  <div class="stat"><b>BALANCE</b><span id="balance">10,000.00</span></div>
  <div class="stat"><b>BET</b><span id="bet">10.00</span></div>
  <div class="stat"><b>WIN</b><span id="win">0.00</span></div>
</section>

<section class="controls">
  <button class="ctrl" id="soundBtn" onclick="toggleSound()">🔇</button>
  <button class="ctrl" onclick="changeBet(-1)">−</button>
  <button class="spin" id="spin" onclick="spin()">↻</button>
  <button class="ctrl" onclick="changeBet(1)">+</button>
  <button class="ctrl gold" onclick="toggleTurbo()">⚡</button>
  <button class="ctrl" onclick="toggleAuto()">▶</button>
</section>
<div class="message" id="message">GOOD LUCK, WARRIOR!</div>
</main>

    const strip=document.createElement('div'); strip.className='strip';
    const order=[];
    for(let i=0;i<12;i++) order.push((c*2+i)%images.length);
    order.forEach(idx=>{
      const el=document.createElement('div');el.className='symbol';
      el.style.backgroundImage=`url("data:image/jpeg;base64,${images[idx]}")`;
      strip.appendChild(el);
    });
    reel.appendChild(strip);reelsEl.appendChild(reel);
  }
}
function beep(freq,dur,type='sine'){
  if(!sound)return;
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.stop(A.currentTime+dur);
  }catch(e){}
}
function changeBet(d){if(spinning)return;bet=Math.max(1,Math.min(100,bet+d));document.getElementById('bet').textContent=money(bet);showMsg('BET '+money(bet));beep(420,.05)}
function toggleSound(){sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔇':'🔊';document.getElementById('soundTop').textContent=sound?'🔊':'🔇';showMsg(sound?'SOUND ON':'SOUND OFF')}
function toggleTurbo(){turbo=!turbo;showMsg(turbo?'TURBO ON':'TURBO OFF');beep(620,.08,'square')}
function toggleAuto(){auto=!auto;showMsg(auto?'AUTO ON':'AUTO OFF');if(auto){spin();}else if(autoTimer){clearTimeout(autoTimer);autoTimer=null}}
function spin(){
  if(spinning)return;
  if(balance<bet){showMsg('NOT ENOUGH BALANCE');beep(120,.15);return}
  spinning=true;balance-=bet;document.getElementById('balance').textContent=money(balance);document.getElementById('win').textContent='0.00';
  showMsg('SPINNING...');beep(180,.09,'sawtooth');
  const strips=[...document.querySelectorAll('.strip')];
  const duration=turbo?650:1150;
  strips.forEach((strip,c)=>{
    const symbolH=strip.parentElement.clientHeight;
    const loops=6+c*2;
    const stop=(Math.floor(Math.random()*6))*symbolH;
    strip.style.transition=`transform ${duration+c*140}ms cubic-bezier(.12,.8,.18,1)`;
    strip.style.transform=`translateY(-${loops*symbolH+stop}px)`;
  });
  setTimeout(()=>{
    const win=Math.random()<.34?Math.round((bet*(1+Math.random()*12))*100)/100:0;
    balance+=win;document.getElementById('balance').textContent=money(balance);document.getElementById('win').textContent=money(win);
    if(win>0){showMsg('WIN! +'+money(win));beep(720,.12);setTimeout(()=>beep(960,.15),100);}
    else{showMsg('NO WIN');beep(180,.08)}
    spinning=false;
    if(auto)autoTimer=setTimeout(spin,turbo?250:650);
  },duration+4*140+80);
}
buildReels();
