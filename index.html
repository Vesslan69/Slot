.game:after{content:"";position:absolute;inset:45% 0 0;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.42) 55%,rgba(0,0,0,.72))}
.ui{position:relative;z-index:2;min-height:100vh}
.top-actions{position:absolute;top:2.2%;left:2.2%;right:2.2%;display:flex;justify-content:space-between}
.icon,.control{border-radius:50%;background:rgba(4,9,14,.8);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 12px rgba(246,181,43,.3),inset 0 0 10px rgba(255,255,255,.08)}
.icon{width:58px;height:58px;border:2px solid var(--gold);font-size:28px}.control{width:74px;height:74px;border:2px solid var(--gold);font-size:34px;font-weight:700}.control.gold{color:#ffd34e;border-color:#ffd21d}
.icon:active,.control:active,.spin:active{transform:scale(.94)}
.stats{position:absolute;left:5%;right:5%;bottom:15.2%;display:flex;justify-content:space-between;gap:12px}
.stat{flex:1;text-align:center;padding:10px 6px;border:2px solid #8e5c12;border-radius:10px;background:rgba(2,7,13,.88);box-shadow:inset 0 0 12px rgba(255,180,30,.08)}
.stat b{display:block;color:#d9a52e;font-size:14px;letter-spacing:1px}.stat span{display:block;font-size:22px;font-weight:800;margin-top:3px}
.bottom-controls{position:absolute;left:2%;right:2%;bottom:3.1%;display:flex;align-items:center;justify-content:center;gap:2.2%}
.spin{width:142px;height:142px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 50% 50%,#0d416b 0 47%,#08233a 48% 61%,#f2a719 62% 65%,#160f06 66% 100%);box-shadow:0 0 28px rgba(255,166,25,.7),inset 0 0 18px rgba(255,214,96,.35);color:#ffb51b;font-size:65px;cursor:pointer;display:grid;place-items:center}
.message{position:absolute;bottom:1.1%;left:0;right:0;text-align:center;color:#f6b52b;font-size:20px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px #000;z-index:3}
@media(max-width:600px){.icon{width:52px;height:52px;font-size:25px}.bottom-controls{bottom:3.8%;gap:1.8%}.control{width:62px;height:62px;font-size:29px}.spin{width:112px;height:112px;font-size:52px}.stats{bottom:17.2%;left:2.5%;right:2.5%;gap:6px}.stat{padding:7px 3px}.stat b{font-size:11px}.stat span{font-size:17px}.message{font-size:16px;bottom:1.8%}}
</style></head>
<body><main class="game"><div class="ui">
<div class="top-actions"><button class="icon" onclick="msg('MENU')">☰</button><button class="icon" onclick="toggleSound()">🔊</button></div>
<div class="stats"><div class="stat"><b>BALANCE</b><span id="balance">10,000.00</span></div><div class="stat"><b>BET</b><span id="bet">10.00</span></div><div class="stat"><b>WIN</b><span id="win">0.00</span></div></div>
<div class="bottom-controls"><button class="control" onclick="toggleSound()">🔇</button><button class="control" onclick="changeBet(-1)">−</button><button class="spin" onclick="spin()">↻</button><button class="control" onclick="changeBet(1)">+</button><button class="control gold" onclick="msg('TURBO')">⚡</button><button class="control" onclick="msg('AUTO')">▶</button></div>
<div class="message" id="message">GOOD LUCK, WARRIOR!</div></div></main>
<script>
let bet=10,balance=10000,sound=true,spinning=false;
const $=id=>document.getElementById(id);
function fmt(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function msg(t){$('message').textContent=t}
function changeBet(d){bet=Math.max(1,Math.min(100,bet+d));$('bet').textContent=fmt(bet);msg('BET '+fmt(bet))}
function toggleSound(){sound=!sound;msg(sound?'SOUND ON':'SOUND OFF')}
function spin(){if(spinning)return;if(balance<bet){msg('NOT ENOUGH BALANCE');return}spinning=true;balance-=bet;$('balance').textContent=fmt(balance);$('win').textContent='0.00';msg('SPINNING...');const b=document.querySelector('.spin');b.animate([{transform:'rotate(0deg)'},{transform:'rotate(1080deg)'}],{duration:1250,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(()=>{const win=Math.random()<.34?Math.round((bet*(1+Math.random()*9))*100)/100:0;balance+=win;$('balance').textContent=fmt(balance);$('win').textContent=fmt(win);msg(win>0?'WIN! +'+fmt(win):'NO WIN');spinning=false},1250)}
</script></body></html>
