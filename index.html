.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:flex-start;z-index:10}
.round,.ctrl{border:2px solid var(--gold);background:rgba(2,8,13,.82);color:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 14px rgba(245,181,43,.45)}
.round{position:relative;z-index:10;width:54px;height:54px;font-size:27px}
.reel-box{margin:0 7px;padding:8px;border:3px solid #9b691b;border-radius:18px;background:linear-gradient(#122331,#03080e);box-shadow:0 0 18px #000,inset 0 0 12px rgba(255,190,40,.18)}
.reels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;background:#02060a;border:2px solid #344957;border-radius:7px}
.reel{height:270px;overflow:hidden;position:relative;background:#06101a;border:1px solid #3c5667}
.strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform}
.symbol{width:100%;height:90px;flex:0 0 90px;background-size:cover;background-position:center;border-bottom:1px solid #263d4c}
.lines{display:flex;justify-content:space-between;color:#f2c24d;font-weight:900;font-size:12px;padding:6px 2px 0;text-shadow:0 2px 3px #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 7px 7px}
.stat{text-align:center;padding:7px 2px;border:2px solid #8d5e15;border-radius:12px;background:linear-gradient(#07131e,#02070d);box-shadow:inset 0 0 12px rgba(245,181,43,.08)}
.stat b{display:block;color:#d9a52e;font-size:11px;letter-spacing:1px}
.stat span{font-size:18px;font-weight:900}
.controls{display:grid;grid-template-columns:1fr 1fr 104px 1fr 1fr 1fr;align-items:center;justify-items:center;width:100%;max-width:720px;margin:0 auto;gap:10px;padding:8px 10px;box-sizing:border-box}
.ctrl{width:52px;height:52px;font-size:25px;font-weight:900}
.ctrl.gold{color:#ffd72d;border-color:#ffd72d}
.spin{grid-column:3;grid-row:1;justify-self:center;align-self:center;width:104px;height:104px;}
.message{height:34px;text-align:center;color:#f4bc36;font-weight:900;font-size:16px;text-shadow:0 2px 4px #000}
.footer{height:120px;background:linear-gradient(#03101b,#02070d)}
button:active{transform:scale(.94)}
@media(min-width:500px){
.header{height:350px}
.reel{height:300px}.symbol{height:100px;flex-basis:100px}
.stats{margin-left:12px;margin-right:12px}
}
</style>
</head>
<body>
<main class="game">
<section class="header">
  <div class="top">
    <button class="round" onclick="showMsg('MENU')">☰</button>
  </div>
</section>

<section class="reel-box">
  <div class="reels" id="reels"></div>
  <div class="lines"><span>10 LINES</span><span>NORDIC WARRIOR</span><span>10 LINES</span></div>
</section>

<section class="stats">
  <div class="stat"><b>BALANCE</b><span id="balance">10,000.00</span></div>
  <div class="stat"><b>BET</b><span id="bet">10.00</span></div>
  <div class="stat"><b>WIN</b><span id="win">0.00</span></div>
</section>

<section class="controls">

function money(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function showMsg(s){document.getElementById('message').textContent=s}

function buildReels(){
  const root=document.getElementById('reels');
  root.innerHTML='';
  for(let c=0;c<5;c++){
    const reel=document.createElement('div');
    reel.className='reel';
    const strip=document.createElement('div');
    strip.className='strip';

    // Long strips are important: the animation can travel many rotations
    // without ever running past the available symbols.
    for(let i=0;i<60;i++){
      const idx=(c*3+i)%images.length;
      const cell=document.createElement('div');
      cell.className='symbol';
      cell.style.backgroundImage='url("data:image/jpeg;base64,'+images[idx]+'")';
      strip.appendChild(cell);
    }
    reel.appendChild(strip);
    root.appendChild(reel);
  }
}

function beep(freq,dur,type='sine'){
  if(!sound)return;
  try{
    const A=new(window.AudioContext||window.webkitAudioContext)();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=.035;
    o.connect(g);g.connect(A.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);
    o.stop(A.currentTime+dur);
  }catch(e){}
}

function changeBet(d){
  if(spinning)return;
  bet=Math.max(1,Math.min(100,bet+d));
  document.getElementById('bet').textContent=money(bet);
  showMsg('BET '+money(bet));beep(420,.05);
}

function toggleSound(){
  sound=!sound;
  document.getElementById('soundBtn').textContent=sound?'🔇':'🔊';
  showMsg(sound?'SOUND ON':'SOUND OFF');
}

function toggleTurbo(){
  turbo=!turbo;showMsg(turbo?'TURBO ON':'TURBO OFF');beep(620,.08,'square');
}

function toggleAuto(){
  auto=!auto;showMsg(auto?'AUTO ON':'AUTO OFF');
  if(auto)spin();
  else if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
}

function spin(){
  if(spinning)return;
  if(balance<bet){showMsg('NOT ENOUGH BALANCE');beep(120,.15);return}

  spinning=true;
  balance-=bet;
  document.getElementById('balance').textContent=money(balance);
  document.getElementById('win').textContent='0.00';
  showMsg('SPINNING...');
  beep(180,.09,'sawtooth');

  const strips=[...document.querySelectorAll('.strip')];
  const cellH=strips[0].querySelector('.symbol').getBoundingClientRect().height;
  const duration=turbo?620:1050;

  strips.forEach((strip,c)=>{
    // Reset first, so every new spin starts from a valid position.
    strip.style.transition='none';
    strip.style.transform='translate3d(0,0,0)';

    const loops=12+c*3;
    const stop=Math.floor(Math.random()*12)*cellH;

    requestAnimationFrame(()=>{
      strip.style.transition='transform '+(duration+c*150)+'ms cubic-bezier(.12,.8,.18,1)';
      strip.style.transform='translate3d(0,-'+(loops*cellH+stop)+'px,0)';
    });
  });

  setTimeout(()=>{
    const win=Math.random()<.34?Math.round((bet*(1+Math.random()*12))*100)/100:0;
    balance+=win;
    document.getElementById('balance').textContent=money(balance);
    document.getElementById('win').textContent=money(win);

    if(win>0){
      showMsg('WIN! +'+money(win));
      beep(720,.12);setTimeout(()=>beep(960,.15),100);
    }else{
      showMsg('NO WIN');beep(180,.08);
    }

    spinning=false;
    if(auto)autoTimer=setTimeout(spin,turbo?250:650);
  },duration+4*150+150);
}

buildReels();
</script>
